[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-translate"
version = "0.1.0"
description = "Reproducible bulk translation pipeline for datasets"
requires-python = ">=3.11"
dependencies = [
  "ctranslate2==4.8.1",
  "huggingface-hub>=0.24,<1.0",
  "orjson>=3.10,<4",
  "sentencepiece>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
